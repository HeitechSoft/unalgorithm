name: Bug report
description: For contributors. Something in unAlgorithm itself is broken (settings, popup, Highlights, AI setup, onboarding). Using unAlgorithm? Use Report a problem inside unAlgorithm instead.
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: |
        **Using unAlgorithm and something is broken?** Please don't use this form: an issue is public. Use
        **Report a problem** in the toolbar popup (or Settings → About), which shows you the report and sends it to
        us privately when you click Send report, or email support@heitechsoft.com.

        This form is for contributors. For posts hidden by mistake (or noise getting through), use **Filtering looks
        wrong** instead. Security problem? Please report it privately; see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Settings → AI
        2. ...
  - type: input
    id: version
    attributes:
      label: unAlgorithm version
      description: Settings → About
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      description: Chrome, Microsoft Edge or Firefox, with its version
      placeholder: Chrome 141 on Windows 11
    validations:
      required: true
  - type: dropdown
    id: ai
    attributes:
      label: AI source
      options:
        - Rules only (AI off)
        - On this device
        - Your own key (Anthropic)
        - Your own key (OpenAI)
        - Your own key (Google Gemini)
        - Your own key (OpenRouter)
        - Your own key (Groq)
        - Local or self-hosted (Ollama, LM Studio, other)
        - unAlgorithm Cloud
        - Another unAlgorithm server
        - HeitechSoft Private AI
        - Other
  - type: textarea
    id: logs
    attributes:
      label: Errors
      description: "Anything from the extension's background console: chrome://extensions or edge://extensions → Inspect views, or in Firefox about:debugging → This Firefox → Inspect. Remove API keys and post text."
      render: text
