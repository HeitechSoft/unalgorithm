name: Bug report
description: Something in UnAlgorithm itself is broken (settings, popup, side panel, AI setup, onboarding).
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: |
        For posts hidden by mistake (or noise getting through), use **Filtering looks wrong** instead.
        Security problem? Please report it privately; see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Settings → AI
        2. ...
  - type: input
    id: version
    attributes:
      label: UnAlgorithm version
      description: Settings → About
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Chrome 141 on Windows 11
    validations:
      required: true
  - type: dropdown
    id: ai
    attributes:
      label: AI source
      options:
        - Rules only (AI off)
        - On this device
        - Your own key (Anthropic)
        - Your own key (OpenAI)
        - Your own key (Google Gemini)
        - Your own key (OpenRouter)
        - Your own key (Groq)
        - Local or self-hosted (Ollama, LM Studio, other)
        - HeitechSoft Private AI
        - Other
  - type: textarea
    id: logs
    attributes:
      label: Errors
      description: Anything from the extension's service worker console (chrome://extensions → Inspect views). Remove API keys and post text.
      render: text
