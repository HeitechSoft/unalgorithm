name: Idea or feature request
description: Suggest something that would make your feed calmer.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Ideas are welcome here, or by email to support@heitechsoft.com. Something broken? Use **Report a problem**
        inside unAlgorithm instead, which sends us a report privately.
  - type: textarea
    id: problem
    attributes:
      label: What's the problem?
      description: What do you see in your feed, or what can't you do today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - LinkedIn
        - Facebook
        - Another site
        - AI
        - Settings and controls
        - Other
