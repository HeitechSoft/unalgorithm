    url: https://github.com/HeitechSoft/unalgorithm/discussions
    about: Ask a question or start a conversation.
  - name: Report a security problem
    url: https://github.com/HeitechSoft/unalgorithm/security/advisories/new
    about: Please report security issues privately.
  - name: Corrections and appeals
    url: https://unalgorithmfeed.com/corrections/
    about: A fact-check or UnEcho Chamber result looks wrong (ask from the result in unAlgorithm), or an outlet's lean on unAlgorithm Cloud's source list. How to ask, and what never to send.
