name: Fact-check or UnEcho Chamber methodology
description: For contributors proposing a fix to how Fact-check or UnEcho Chamber work. To ask for a correction of a result, use Report a wrong verdict or Report a mistake in unAlgorithm, or email support@heitechsoft.com.
title: "[Methodology] "
labels: [methodology, triage]
body:
  - type: markdown
    attributes:
      value: |
        **Asking us to correct a result?** Please don't use this form: an issue is public. Under the result in
        unAlgorithm, choose **Report a wrong verdict** (Fact-check) or **Report a mistake** (UnEcho Chamber), which
        sends your correction to us privately, or email support@heitechsoft.com. How corrections work:
        https://unalgorithmfeed.com/corrections/

        This form is for contributors proposing a change to a prompt, the blocklist, the evaluation set or the
        methodology. **What never to send.** Use your own words: never the post, a screenshot of it, a link to it, or
        anyone's name, and never a correction someone sent us.
  - type: dropdown
    id: feature
    attributes:
      label: Feature
      options:
        - Fact-check
        - UnEcho Chamber
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: What should change
      description: A prompt, the blocklist, an evaluation case, a model choice or the methodology page.
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: A made-up example
      description: A claim or a story that shows the problem, written for this issue. Not a real post.
  - type: textarea
    id: why
    attributes:
      label: Why, with public sources
      description: Links to public pages. Not a link to a post.
    validations:
      required: true
  - type: input
    id: prompt
    attributes:
      label: Prompt version
      description: As the published prompts page shows it.
