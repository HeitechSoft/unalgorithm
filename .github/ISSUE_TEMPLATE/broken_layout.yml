name: Filtering looks wrong
description: A post was hidden that shouldn't be, noise got through, or UnAlgorithm says the layout looks different.
title: '[platform] Filtering looks wrong'
labels: [detection, triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please **don't paste screenshots or text of other people's posts**, names or profile
        links. Describe the post instead ("an ad for a course", "a post from a group I joined").
  - type: dropdown
    id: platform
    attributes:
      label: Site
      options:
        - LinkedIn
        - Facebook
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: What went wrong?
      options:
        - A post I wanted was hidden
        - Noise (ad, suggested post, activity) was not hidden
        - The "layout looks different" banner appeared
        - The feed stopped loading or got slow
        - Something else
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What kind of post was it, and what did UnAlgorithm show (the reason on the stub, or "Why?")?
    validations:
      required: true
  - type: dropdown
    id: strength
    attributes:
      label: Strength
      options:
        - Light
        - Balanced
        - Calm
        - Custom
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Filled in automatically when you use "Report a problem". Contains versions, counts and detector names only.
      render: json
  - type: input
    id: language
    attributes:
      label: Site language
      description: The language LinkedIn or Facebook is set to.
      placeholder: English
