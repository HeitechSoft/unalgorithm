name: Filtering looks wrong
description: For contributors working on detection. Using unAlgorithm? Use Why? → Wrong call? or Report a problem inside unAlgorithm instead, which sends us a report privately.
title: '[platform] Filtering looks wrong'
labels: [detection, triage]
body:
  - type: markdown
    attributes:
      value: |
        **Using unAlgorithm and your feed looks wrong?** Please don't use this form: an issue is public. Use
        **Why? → Wrong call?** on the post, or **Report a problem** in the toolbar popup. unAlgorithm shows you the
        report and sends it to us privately when you click Send report. Or email support@heitechsoft.com.

        This form is for contributors tracking detection work. **Don't paste screenshots or text of other people's
        posts**, names or profile links, and never a problem report someone sent us. Describe the post instead ("an ad
        for a course", "a post from a group I joined").
  - type: dropdown
    id: platform
    attributes:
      label: Site
      options:
        - LinkedIn
        - Facebook
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: What went wrong?
      options:
        - A post I wanted was hidden
        - Noise (ad, suggested post, activity) was not hidden
        - unAlgorithm says filtering is paused, or that it isn't running on the feed
        - The feed stopped loading or got slow
        - Something else
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What kind of post was it, and what did unAlgorithm show (the reason on the stub, or "Why?")?
    validations:
      required: true
  - type: dropdown
    id: strength
    attributes:
      label: Strength
      options:
        - Light
        - Balanced
        - Calm
        - Custom
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: "From a development build on your own feed (the popup's Developer: copy diagnostics). Versions, counts and detector names only."
      render: json
  - type: input
    id: language
    attributes:
      label: Site language
      description: The language LinkedIn or Facebook is set to.
      placeholder: English
