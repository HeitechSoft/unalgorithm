version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # WXT is pre-1.0 and pinned exactly; it gets its own PR so E2E can gate it.
    groups:
      wxt:
        patterns: ['wxt', '@wxt-dev/*']
      react:
        patterns: ['react', 'react-dom', '@types/react', '@types/react-dom']
      ai-sdks:
        patterns: ['@anthropic-ai/sdk', 'openai']
      dev-tooling:
        dependency-type: development
        exclude-patterns: ['wxt', '@wxt-dev/*', '@types/react', '@types/react-dom']
        update-types: [minor, patch]
    labels: [dependencies]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ['*']
    labels: [dependencies]
