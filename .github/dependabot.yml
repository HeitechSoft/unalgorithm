version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # WXT is pre-1.0 and pinned exactly; it gets its own PR so E2E can gate it.
    groups:
      wxt:
        patterns: ['wxt', '@wxt-dev/*']
      react:
        patterns: ['react', 'react-dom', '@types/react', '@types/react-dom']
      ai-sdks:
        patterns: ['@anthropic-ai/sdk', 'openai']
      # Better Auth is pinned exactly and its advisories are watched: auth updates arrive in a PR of their own. The CLI
      # (`auth`) pins `better-auth` exactly, so the two must move together.
      auth:
        patterns: ['better-auth', '@better-auth/*', 'auth']
      # What drives the e2e tests (Playwright in Chromium and Edge, Puppeteer in Firefox, axe for accessibility) moves in
      # one PR, gated by the e2e jobs in all three browsers. puppeteer-core and @puppeteer/browsers are pinned exactly,
      # and CI's Firefox is the release puppeteer-core is tested with (FIREFOX_VERSION in ci.yml): update that pin in the
      # same PR.
      browser-automation:
        patterns: ['@playwright/test', 'puppeteer-core', '@puppeteer/browsers', 'axe-core', '@axe-core/playwright']
      dev-tooling:
        dependency-type: development
        exclude-patterns: ['wxt', '@wxt-dev/*', '@types/react', '@types/react-dom', 'better-auth', '@better-auth/*', 'auth',
          '@playwright/test', 'puppeteer-core', '@puppeteer/browsers', 'axe-core', '@axe-core/playwright']
        update-types: [minor, patch]
    labels: [dependencies]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ['*']
    labels: [dependencies]
