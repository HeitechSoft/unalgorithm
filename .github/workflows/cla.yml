name: CLA

# CLA Assistant Lite. It is OFF until the reviewed CLA is published: CLA.md is still a draft, and nobody should be
# asked to sign a draft. It only runs when started by hand (and then does nothing, because the job needs a PR event).
#
# To turn it on once the final CLA lands:
#   1. Publish the final text as CLA-v1.md and point path-to-document at it (a fixed version, not a moving file),
#      with a matching path-to-signatures (signatures/cla-v1.json), so a later text change asks people to re-sign.
#   2. Create an unprotected branch for the signatures (git switch --orphan cla-signatures; commit; push), and keep it
#      out of every branch ruleset.
#   3. Replace the `on:` block with:
#        issue_comment:
#          types: [created]
#        pull_request_target:
#          types: [opened, closed, synchronize]
#
# It runs on pull_request_target so it can comment on forks' PRs, and therefore never checks out or runs PR code.

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
        (github.event.comment.body == 'recheck' ||
         github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    runs-on: ubuntu-latest
    steps:
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/cla-v1.json
          path-to-document: https://github.com/HeitechSoft/unalgorithm/blob/main/CLA-v1.md
          branch: cla-signatures
          allowlist: dependabot[bot],github-actions[bot],renovate[bot]
          lock-pullrequest-aftermerge: false
