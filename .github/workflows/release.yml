name: Release

# Runs when a version tag is pushed (see docs/release.md). Builds the extension zip, checksums it, attests build
# provenance, attaches both to a GitHub Release and submits the same zip to the Chrome Web Store for review. An approved
# version waits in the store for a person to publish it after the smoke test (STAGED_PUBLISH).

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Verify
        run: pnpm check && pnpm fixtures:check && pnpm notices:check

      - name: Check the tag matches the extension version
        id: version
        run: |
          version=$(node -p "require('./apps/extension/package.json').version")
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match apps/extension version $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build zip
        run: pnpm zip

      - name: Checksums
        working-directory: apps/extension/.output
        run: sha256sum *-chrome.zip > SHA256SUMS.txt && cat SHA256SUMS.txt

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: apps/extension/.output/*-chrome.zip

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/release-notes.mjs "${GITHUB_REF_NAME}" > release-notes.md
          gh release create "${GITHUB_REF_NAME}" \
            apps/extension/.output/*-chrome.zip \
            apps/extension/.output/SHA256SUMS.txt \
            --title "unAlgorithm Feed ${GITHUB_REF_NAME}" \
            --notes-file release-notes.md \
            --verify-tag

      # Chrome Web Store API v2 as the release service account (docs/release.md, "Chrome Web Store credentials").
      # Secrets can't be read in `if:`, so the script skips with a notice until the `release` environment has them.
      - name: Chrome Web Store
        working-directory: apps/extension
        env:
          CHROME_API_VERSION: v2
          CHROME_PUBLISH_TYPE: STAGED_PUBLISH
          CHROME_ZIP: .output/unalgorithm-${{ steps.version.outputs.version }}-chrome.zip
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
          CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL: ${{ secrets.CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL }}
          CHROME_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.CHROME_SERVICE_ACCOUNT_PRIVATE_KEY }}
        run: |
          missing=()
          for name in CHROME_EXTENSION_ID CHROME_PUBLISHER_ID CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL \
            CHROME_SERVICE_ACCOUNT_PRIVATE_KEY; do
            if [ -z "${!name}" ]; then missing+=("$name"); fi
          done
          if [ "${#missing[@]}" -eq 4 ]; then
            echo "::notice::Chrome Web Store secrets are not set; upload the zip by hand (docs/release.md, step 6)."
            exit 0
          fi
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing Chrome Web Store secrets in the release environment: ${missing[*]}"
            exit 1
          fi
          # A key pasted from the JSON key file keeps its "\n" escapes; signing needs real line breaks.
          export CHROME_SERVICE_ACCOUNT_PRIVATE_KEY="${CHROME_SERVICE_ACCOUNT_PRIVATE_KEY//\\n/$'\n'}"
          pnpm exec wxt submit
