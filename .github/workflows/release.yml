name: Release

# Runs when a version tag is pushed (see docs/release.md). Builds every zip from one `pnpm zip` (Chrome, Edge and
# Firefox for their stores, the Firefox sources zip AMO builds from, and the Chrome and Edge sideload zip), lints the
# Firefox zip as AMO will, has AMO sign the Firefox sideload build when its credentials are set, checksums and attests
# every file, attaches them to a GitHub Release, and submits the store zips: the Chrome Web Store (approved versions wait
# for a person to publish them, STAGED_PUBLISH), Firefox Add-ons (listed) and Microsoft Edge Add-ons (uploaded as a
# draft for a person to submit). Each store step skips with a notice until its secrets are set.

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Verify
        run: pnpm check && pnpm fixtures:check && pnpm notices:check

      - name: Check the tag matches the extension version
        id: version
        run: |
          version=$(node -p "require('./apps/extension/package.json').version")
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match apps/extension version $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build zips
        # The one step that builds what ships, for every browser: whatever environment it has (UA_CLOUD, the Cloud
        # card's switch) reaches all of them (apps/extension/tests/privacy-gate.test.ts checks).
        run: pnpm zip
        env:
          UA_CLOUD: "1"

      - name: Firefox add-on lint
        # The linter AMO runs on upload: no errors, and only the reviewed warnings (scripts/check-firefox-lint.mjs).
        run: node scripts/check-firefox-lint.mjs apps/extension/.output/firefox-mv3

      - name: Firefox sources match the Firefox zip
        # Only committed files and nothing private in the sources zip, and AMO's reviewers can rebuild the Firefox zip
        # from it byte for byte.
        run: node scripts/check-firefox-sources.mjs

      # AMO signs the Firefox sideload build (the development add-on id) as an unlisted add-on, so the release can carry
      # a file release Firefox installs. Same credentials as the Firefox Add-ons step; skipped without them. The file is
      # optional: if AMO doesn't sign it (an error, or no approval within web-ext's 15 minutes), the step only warns and
      # the release, store submissions included, goes out without it (docs/release.md, The signed sideload).
      - name: Signed Firefox sideload
        working-directory: apps/extension
        env:
          VERSION: ${{ steps.version.outputs.version }}
          FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
          FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
        run: |
          if [ -z "$FIREFOX_JWT_ISSUER" ] && [ -z "$FIREFOX_JWT_SECRET" ]; then
            echo "::notice::Firefox Add-ons secrets are not set; the release has no signed Firefox file."
            exit 0
          fi
          if [ -z "$FIREFOX_JWT_ISSUER" ] || [ -z "$FIREFOX_JWT_SECRET" ]; then
            echo "::error::Set both FIREFOX_JWT_ISSUER and FIREFOX_JWT_SECRET in the release environment."
            exit 1
          fi
          unsigned="the release goes out without the signed Firefox file (docs/release.md, The signed sideload)."
          if ! pnpm exec web-ext sign --channel unlisted --no-config-discovery \
            --source-dir .output/firefox-mv3-sideload \
            --upload-source-code ".output/unalgorithm-${VERSION}-sources.zip" \
            --artifacts-dir .output/signed \
            --api-key "$FIREFOX_JWT_ISSUER" --api-secret "$FIREFOX_JWT_SECRET"; then
            echo "::warning::AMO did not sign the Firefox sideload; $unsigned"
            exit 0
          fi
          shopt -s nullglob
          signed=(.output/signed/*.xpi)
          if [ "${#signed[@]}" -ne 1 ]; then
            echo "::warning::AMO returned ${#signed[@]} signed files instead of one; $unsigned"
            exit 0
          fi
          mv "${signed[0]}" ".output/unalgorithm-${VERSION}-firefox-sideload.xpi"

      - name: Checksums
        working-directory: apps/extension/.output
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          shopt -s nullglob
          sha256sum "unalgorithm-${VERSION}"-*.zip "unalgorithm-${VERSION}"-*.xpi > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          # Every file the checksums list.
          subject-checksums: apps/extension/.output/SHA256SUMS.txt

      - name: GitHub Release
        working-directory: apps/extension/.output
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          shopt -s nullglob
          node ../../../scripts/release-notes.mjs "${GITHUB_REF_NAME}" > "$RUNNER_TEMP/release-notes.md"
          gh release create "${GITHUB_REF_NAME}" \
            "unalgorithm-${VERSION}"-*.zip "unalgorithm-${VERSION}"-*.xpi SHA256SUMS.txt \
            --title "unAlgorithm Feed ${GITHUB_REF_NAME}" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --verify-tag

      # Chrome Web Store API v2 as the release service account (docs/release.md, "Chrome Web Store credentials").
      # Secrets can't be read in `if:`, so the script skips with a notice until the `release` environment has them.
      - name: Chrome Web Store
        working-directory: apps/extension
        env:
          CHROME_API_VERSION: v2
          CHROME_PUBLISH_TYPE: STAGED_PUBLISH
          CHROME_ZIP: .output/unalgorithm-${{ steps.version.outputs.version }}-chrome.zip
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
          CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL: ${{ secrets.CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL }}
          CHROME_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.CHROME_SERVICE_ACCOUNT_PRIVATE_KEY }}
        run: |
          missing=()
          for name in CHROME_EXTENSION_ID CHROME_PUBLISHER_ID CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL \
            CHROME_SERVICE_ACCOUNT_PRIVATE_KEY; do
            if [ -z "${!name}" ]; then missing+=("$name"); fi
          done
          if [ "${#missing[@]}" -eq 4 ]; then
            echo "::notice::Chrome Web Store secrets are not set; upload the zip by hand (docs/release.md, step 6)."
            exit 0
          fi
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing Chrome Web Store secrets in the release environment: ${missing[*]}"
            exit 1
          fi
          # A key pasted from the JSON key file keeps its "\n" escapes; signing needs real line breaks.
          export CHROME_SERVICE_ACCOUNT_PRIVATE_KEY="${CHROME_SERVICE_ACCOUNT_PRIVATE_KEY//\\n/$'\n'}"
          pnpm exec wxt submit

      # Firefox Add-ons API (docs/release.md, "Firefox Add-ons credentials"): the zip with its sources, on the listed
      # channel. AMO has no staged publish: an approved version goes live, so the smoke test comes before the tag.
      - name: Firefox Add-ons
        working-directory: apps/extension
        env:
          FIREFOX_ZIP: .output/unalgorithm-${{ steps.version.outputs.version }}-firefox.zip
          FIREFOX_SOURCES_ZIP: .output/unalgorithm-${{ steps.version.outputs.version }}-sources.zip
          FIREFOX_EXTENSION_ID: feed@unalgorithmfeed.com
          FIREFOX_CHANNEL: listed
          FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
          FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
        run: |
          missing=()
          for name in FIREFOX_JWT_ISSUER FIREFOX_JWT_SECRET; do
            if [ -z "${!name}" ]; then missing+=("$name"); fi
          done
          if [ "${#missing[@]}" -eq 2 ]; then
            echo "::notice::Firefox Add-ons secrets are not set; upload the zip and its sources by hand (docs/release.md)."
            exit 0
          fi
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing Firefox Add-ons secrets in the release environment: ${missing[*]}"
            exit 1
          fi
          pnpm exec wxt submit

      # Microsoft Edge Add-ons API v1.1 (docs/release.md, "Edge Add-ons credentials"): the zip is uploaded as a draft
      # and not submitted (EDGE_SKIP_SUBMIT_REVIEW): Edge publishes an approved version at once, so a person submits it
      # in Partner Center after the smoke test.
      - name: Microsoft Edge Add-ons
        working-directory: apps/extension
        env:
          EDGE_ZIP: .output/unalgorithm-${{ steps.version.outputs.version }}-edge.zip
          EDGE_SKIP_SUBMIT_REVIEW: 'true'
          EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
        run: |
          missing=()
          for name in EDGE_PRODUCT_ID EDGE_CLIENT_ID EDGE_API_KEY; do
            if [ -z "${!name}" ]; then missing+=("$name"); fi
          done
          if [ "${#missing[@]}" -eq 3 ]; then
            echo "::notice::Edge Add-ons secrets are not set; upload the zip in Partner Center by hand (docs/release.md)."
            exit 0
          fi
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing Edge Add-ons secrets in the release environment: ${missing[*]}"
            exit 1
          fi
          pnpm exec wxt submit
