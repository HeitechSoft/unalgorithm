name: Dependency review

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          # Licenses compatible with distributing UnAlgorithm under the AGPL-3.0.
          # The server and its web page have a stricter check, `pnpm licenses:server` in ci.yml: no GPL, AGPL or LGPL,
          # and MPL only after legal review.
          allow-licenses: >-
            MIT, MIT-0, ISC, BSD-2-Clause, BSD-3-Clause, Apache-2.0, 0BSD, Unlicense, CC0-1.0, BlueOak-1.0.0, Zlib,
            Python-2.0, MPL-2.0, AGPL-3.0-only, AGPL-3.0-or-later, LGPL-3.0-only, LGPL-3.0-or-later, CC-BY-4.0
          comment-summary-in-pr: on-failure
