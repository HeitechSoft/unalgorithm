name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR runs are cancelled; every commit on main keeps its result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint and format
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Fixtures contain no personal data
        run: pnpm fixtures:check

      - name: Third-party notices match the bundle
        if: matrix.os == 'ubuntu-latest'
        run: pnpm notices:check

      - name: Server licences
        if: matrix.os == 'ubuntu-latest'
        # Stricter than dependency-review.yml: no third-party GPL, AGPL or LGPL in the server and its web page, and MPL
        # only after legal review (ADR 0007). Reviewed exceptions are in scripts/license-review.json.
        run: pnpm licenses:server

      - name: Build
        run: pnpm zip

      - name: Install Chromium
        working-directory: apps/extension
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: pnpm e2e

      - name: Upload extension zip
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unalgorithm-chrome
          path: apps/extension/.output/*-chrome.zip
          # The build output folder starts with a dot, which upload-artifact skips by default.
          include-hidden-files: true
          if-no-files-found: error

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.os }}
          path: apps/extension/playwright-report
          retention-days: 7

  server:
    # The server against real Postgres 17 and Mailpit, and the extension signing in to it end to end (e2e/cloud.spec.ts).
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_PASSWORD: dev
          POSTGRES_DB: unalgorithm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d unalgorithm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mailpit:
        image: axllent/mailpit:v1.31
        env:
          # Accept any SMTP login over a plain connection, as compose.dev.yaml does.
          MP_SMTP_AUTH_ACCEPT_ANY: '1'
          MP_SMTP_AUTH_ALLOW_INSECURE: '1'
        ports:
          - 1025:1025 # SMTP
          - 8025:8025 # API
    env:
      # Only used to create and drop each test's own database.
      TEST_DATABASE_URL: postgres://postgres:dev@127.0.0.1:5432/unalgorithm
      MAILPIT_URL: http://127.0.0.1:8025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build the sign-in page
        # The server serves apps/web/dist; without it, / and /authorize answer 503.
        run: pnpm --filter @unalgorithm/web build

      - name: Server tests on Postgres and Mailpit
        run: pnpm vitest run --project server

      - name: Build the extension for end-to-end tests
        run: pnpm --filter @unalgorithm/extension build:e2e

      - name: Install Chromium
        working-directory: apps/extension
        run: pnpm exec playwright install --with-deps chromium

      - name: Sign in to a local server and label the feed
        run: pnpm --filter @unalgorithm/extension exec playwright test e2e/cloud.spec.ts
        env:
          UA_SERVER_E2E: '1'

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-server
          path: apps/extension/playwright-report
          retention-days: 7

  compose-smoke:
    # The server image and the public compose file as self-hosters run them: the build, configuration errors, the
    # published ports, the read-only root, no .env in the image, route-eval inside the container, and a single-quoted
    # value with $ in .env reaching the server unchanged.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compose smoke test
        run: bash apps/server/scripts/compose-smoke.sh

  public-scan:
    # The public repo holds no host address, host marker, key file or secret: every tracked file and the whole history.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Every commit of every branch and tag: both scans read the full history.
          fetch-depth: 0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Public IPv4, host markers and key files
        run: pnpm scan:public
        env:
          # Host names and addresses, one per line. Never printed; empty on fork PRs, which get no secrets.
          PUBLIC_SCAN_EXTRA_PATTERNS: ${{ secrets.PUBLIC_SCAN_EXTRA_PATTERNS }}

      - name: Install gitleaks
        id: install-gitleaks
        if: ${{ !cancelled() }}
        working-directory: ${{ runner.temp }}
        shell: bash
        run: |
          base=https://github.com/gitleaks/gitleaks/releases/download/v8.30.1
          curl -fsSLO "$base/gitleaks_8.30.1_linux_x64.tar.gz"
          curl -fsSLO "$base/gitleaks_8.30.1_checksums.txt"
          # The checksums file lists every release archive, so check this archive's line only: this fails when the
          # line is missing or does not match.
          grep ' gitleaks_8.30.1_linux_x64.tar.gz$' gitleaks_8.30.1_checksums.txt | sha256sum -c -
          # Both files come from the same release, so a replaced release asset would pass the check above. The archive
          # must also match the SHA-256 reviewed when this version was pinned, as actions are pinned by commit.
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks_8.30.1_linux_x64.tar.gz' |
            sha256sum -c -
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz

      - name: Secrets (gitleaks, full history)
        if: ${{ !cancelled() && steps.install-gitleaks.outcome == 'success' }}
        # Reviewed false positives are listed in .gitleaksignore, which gitleaks reads from the repository root.
        run: |
          "$RUNNER_TEMP/gitleaks" git --redact --exit-code 1 .
